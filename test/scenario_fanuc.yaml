# Fanuc (moveit_resources_fanuc_moveit_config, ros2_control mock hardware): a 6-joint arm that is not a UR.
# Same faults as scenario_gazebo.yaml with Fanuc joint and controller names. squeeze is expected to stay unnoticed:
# the Fanuc URDF has effort limit 0 and the mock hardware reports no effort, so armdoc has nothing to compare against.
faults:
  - {at: 4,   for: 8, fault: freeze,   expect: JOINT_STATES_STALE}
  - {at: 18,  for: 8, fault: slow, hz: 0.2, expect: JOINT_STATES_STALE}
  - {at: 32,  for: 8, fault: stutter, up: 1.0, down: 4.0, expect: JOINT_STATES_STALE}
  - {at: 46,  for: 8, fault: lag, delay: 3.0, expect: JOINT_STATES_STALE}
  - {at: 60,  for: 8, fault: noise, sigma: 0.02, expect: NOISY_JOINTS}
  - {at: 74,  for: 8, fault: nan, joint: joint_2, expect: JOINT_NAN}
  - {at: 88,  for: 8, fault: spoof, joint: joint_1, offset: 7.0, expect: LIMIT_POS}
  - {at: 102, for: 8, fault: squeeze, joint: joint_3, effort: 100.0, expect: none}
  - {at: 116, for: 8, fault: spike, joint: joint_1, velocity: 10.0, expect: LIMIT_VEL}
  - {at: 130, for: 10, fault: deactivate, controller: fanuc_controller, expect: [CTRL_INACTIVE, NO_ACTIVE_ARM_CTRL]}
